[tool.poetry]
name = "streamforge-ingest"
version = "0.1.0"
description = "Ingestion worker for StreamForge"
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
kafka-python = "^2.0.2"
polars = "^1.0.0"
minio = "^7.2.0"
psycopg2-binary = "^2.9.9"
pyarrow = "^18.0.0"
python-dotenv = "^1.0.1"
requests = "^2.31.0"
openpyxl = "^3.1.0"
fastexcel = "^0.11.0"
xlsx2csv = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
